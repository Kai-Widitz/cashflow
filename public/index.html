<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cashflow</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ddd; }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    td.amount.negative { color: #c0392b; }
    #status { margin-left: 1rem; color: #555; }
  </style>
</head>
<body>
  <h1>Cashflow</h1>

  <form id="uploadForm">
    <input type="file" id="fileInput" name="statement" accept="application/pdf" required>
    <button type="submit">Import</button>
    <span id="status"></span>
  </form>

  <table id="txTable">
    <thead>
      <tr><th>Date</th><th>Description</th><th>Amount</th><th>Category</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
